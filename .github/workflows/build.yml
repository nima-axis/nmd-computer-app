name: Build NMD COMPUTER

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VER="${TAG#v}"
          CODE=$((100 + ${{ github.run_number }}))
          sed -i -E "s/versionName[ =]+\"[^\"]*\"/versionName \"$VER\"/" app/build.gradle
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode $CODE/" app/build.gradle

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/nmd.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/nmd.jks \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --ks-key-alias "$ALIAS" --out NMD-COMPUTER.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NMD-COMPUTER-apk
          path: NMD-COMPUTER.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" NMD-COMPUTER.apk --clobber
